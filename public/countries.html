<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iSweep">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <title>iSweep — Country Points</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
  <style>
    .search-wrap { margin-bottom: 1.25rem; }
    .search-input {
      width: 100%;
      padding: 0.65rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: var(--text-muted); }

    .country-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .country-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .country-card.has-matches { border-color: rgba(255,255,255,0.12); }

    .country-header {
      display: grid;
      grid-template-columns: 2.8rem 1fr auto auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .country-header:hover { background: rgba(255,255,255,0.03); }

    .country-flag { font-size: 2rem; line-height: 1; text-align: center; }
    .country-name { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .country-sub  { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.1rem; }

    .country-pts {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--gold);
      min-width: 2.5rem;
      text-align: right;
    }
    .country-pts-label { font-size: 0.62rem; color: var(--text-muted); text-align: right; margin-top: 0.1rem; }

    .country-expand-btn {
      background: none;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.1rem 0.4rem;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1;
    }
    .country-expand-btn:hover,
    .country-expand-btn[aria-expanded="true"] { border-color: var(--gold); color: var(--gold); }

    .match-breakdown {
      border-top: 1px solid var(--card-border);
      padding: 0.75rem 1rem 1rem;
      background: rgba(0,0,0,0.15);
    }
    .match-breakdown table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .match-breakdown th {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: right;
      padding: 0 0.5rem 0.45rem;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }
    .match-breakdown th:first-child,
    .match-breakdown th:nth-child(2),
    .match-breakdown th:nth-child(3) { text-align: left; }

    .match-breakdown td {
      padding: 0.4rem 0.5rem;
      text-align: right;
      color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    .match-breakdown td:first-child,
    .match-breakdown td:nth-child(2),
    .match-breakdown td:nth-child(3) { text-align: left; }
    .match-breakdown tr:last-child td { border-bottom: none; }

    .result-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      border-radius: 4px;
      padding: 0.1rem 0.35rem;
      min-width: 1.5rem;
      text-align: center;
    }
    .result-W { background: rgba(74,222,128,0.15); color: #4ade80; }
    .result-D { background: rgba(212,167,44,0.15);  color: var(--gold); }
    .result-L { background: rgba(248,113,113,0.15); color: #f87171; }

    .pts-pos  { color: #4ade80; font-weight: 700; }
    .pts-neg  { color: #f87171; font-weight: 700; }
    .pts-zero { color: var(--text-muted); }
    .pts-total { font-weight: 900; color: var(--text); }

    .bonus-row td { color: var(--gold); font-style: italic; }
    .totals-row td { font-weight: 800; border-top: 1px solid var(--card-border); padding-top: 0.6rem; }

    .no-matches { color: var(--text-muted); font-size: 0.85rem; padding: 0.5rem 0; font-style: italic; }

    .pot-dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      margin-right: 0.3rem; vertical-align: middle;
    }
    .pot-1 { background: #f59e0b; }
    .pot-2 { background: #06d6a0; }
    .pot-3 { background: #8b5cf6; }

    .page-title { margin-bottom: 1.25rem; }
    .page-title h2 { font-size: 1.4rem; font-weight: 900; color: var(--text); margin-bottom: 0.2rem; }
    .page-title p  { font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <img src="/assets/logo.png" alt="iSweep World Cup Sweepstake" class="sweepstake-logo">
      <nav>
        <a href="/">Home</a>
        <a href="/prizes.html">Prizes</a>
        <a href="/teams.html">My Teams</a>
        <a href="/fixtures.html">Fixtures</a>
        <a href="/dashboard.html">Leaderboard</a>
        <a href="/countries.html" class="active">Country Points</a>
        <a href="/matches.html">Group Stage</a>
        <a href="/knockout.html">Knockout</a>
        <a href="/pots.html">Pots</a>
        <a href="/golf">Golf</a>
      </nav>
    </div>
  </header>

  <div class="container" style="max-width:820px">
    <div class="page-title">
      <h2>Country Points Breakdown</h2>
      <p>Each country's points game by game — click a row to expand</p>
    </div>
    <div class="search-wrap">
      <input class="search-input" type="search" id="search" placeholder="Search country…">
    </div>
    <div class="country-list" id="country-list">
      <div style="text-align:center;padding:2rem;color:var(--text-muted)">Loading…</div>
    </div>
  </div>

  <script src="flags.js"></script>
  <script>
    'use strict';

    const FLAG_CODES = {};
    if (typeof GROUPS !== 'undefined') {
      GROUPS.forEach(g => g.teams.forEach(t => { FLAG_CODES[t.name] = t.code; }));
    }

    function flagHtml(team, size) {
      const code = FLAG_CODES[team];
      return code
        ? `<span class="fi fi-${code}" style="font-size:${size};line-height:1" title="${team}"></span>`
        : `<span style="font-size:${size};line-height:1">🏳️</span>`;
    }

    function fmtDate(d) {
      if (!d) return '—';
      return new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
    }

    function fmtStage(s) {
      if (!s) return '';
      return s.replace(/^GROUP_/, 'Group ').replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function ptsCell(val) {
      if (val === 0) return `<span class="pts-zero">—</span>`;
      return `<span class="${val > 0 ? 'pts-pos' : 'pts-neg'}">${val > 0 ? '+' : ''}${val}</span>`;
    }

    function buildCard(t, idx) {
      const flagCode = FLAG_CODES[t.team];
      const flagEl   = flagCode ? `<span class="fi fi-${flagCode}" style="font-size:2rem;line-height:1"></span>` : `<span style="font-size:2rem">🏳️</span>`;
      const potLabel = `<span class="pot-dot pot-${t.pot}"></span>Pot ${t.pot}`;
      const played   = t.matches.length;
      const expandId = `exp-${idx}`;

      let rowsHtml = '';
      if (t.matches.length === 0) {
        rowsHtml = `<div class="no-matches">No matches played yet</div>`;
      } else {
        const thead = `<thead><tr>
          <th>Date</th><th>Stage</th><th>Opponent</th>
          <th title="Score">Sc</th>
          <th title="Result points">Res</th>
          <th title="Goals scored ×2">GF</th>
          <th title="Goals conceded ×−1">GA</th>
          <th title="Yellow cards ×−1">YC</th>
          <th title="Red cards ×−3">RC</th>
          <th title="Match total">Tot</th>
        </tr></thead>`;

        let tbodyRows = t.matches.map(m => {
          const resBadge = `<span class="result-badge result-${m.result}">${m.result}</span>`;
          return `<tr>
            <td>${fmtDate(m.date)}</td>
            <td style="color:var(--text-muted);font-size:0.75rem">${fmtStage(m.stage)}</td>
            <td>${flagHtml(m.opponent,'0.9rem')} ${m.opponent}</td>
            <td>${m.scoreFor}–${m.scoreAgainst} ${resBadge}</td>
            <td>${ptsCell(m.pts.result)}</td>
            <td>${ptsCell(m.pts.goalsFor)}</td>
            <td>${ptsCell(m.pts.goalsAgainst)}</td>
            <td>${ptsCell(m.pts.yellowCards)}</td>
            <td>${ptsCell(m.pts.redCards)}</td>
            <td class="pts-total">${m.pts.total}</td>
          </tr>`;
        }).join('');

        if (t.groupFinish) {
          const pos = ['1st','2nd','3rd','4th'][t.groupFinish.position-1];
          tbodyRows += `<tr class="bonus-row">
            <td colspan="9" style="text-align:left">Group finish bonus (${pos})</td>
            <td class="pts-total pts-pos">+${t.groupFinish.pts}</td>
          </tr>`;
        }

        tbodyRows += `<tr class="totals-row">
          <td colspan="9" style="text-align:left;font-size:0.78rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-muted)">Total</td>
          <td class="pts-total" style="color:var(--gold)">${t.totalPts}</td>
        </tr>`;

        rowsHtml = `<table>${thead}<tbody>${tbodyRows}</tbody></table>`;
      }

      return `
        <div class="country-card ${played > 0 ? 'has-matches' : ''}" data-name="${t.team.toLowerCase()}">
          <div class="country-header" data-expand="${expandId}">
            <div class="country-flag">${flagEl}</div>
            <div>
              <div class="country-name">${t.team}</div>
              <div class="country-sub">${potLabel} &nbsp;·&nbsp; ${played} game${played!==1?'s':''} played</div>
            </div>
            <div style="text-align:right">
              <div class="country-pts">${t.totalPts}</div>
              <div class="country-pts-label">pts</div>
            </div>
            <button class="country-expand-btn" aria-expanded="false" title="Show match breakdown">▾</button>
          </div>
          <div class="match-breakdown" id="${expandId}" hidden>${rowsHtml}</div>
        </div>`;
    }

    async function load() {
      const list = document.getElementById('country-list');
      try {
        const data = await fetch('/api/country-breakdown').then(r => r.json());
        list.innerHTML = data.map((t, i) => buildCard(t, i)).join('');
        wireExpand();
      } catch(e) {
        list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-muted)">Failed to load.</div>';
      }
    }

    function wireExpand() {
      document.querySelectorAll('.country-header').forEach(hdr => {
        hdr.addEventListener('click', () => {
          const btn   = hdr.querySelector('.country-expand-btn');
          const panel = document.getElementById(hdr.dataset.expand);
          if (!panel) return;
          const open = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!open));
          panel.hidden = open;
        });
      });
    }

    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.country-card').forEach(card => {
        card.style.display = card.dataset.name.includes(q) ? '' : 'none';
      });
    });

    load();
  </script>
</body>
</html>
