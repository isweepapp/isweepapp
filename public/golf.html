<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beaver">
<link rel="apple-touch-icon" href="/assets/golf-logo.png">
<title>BEAVER</title>
<style>
  :root{
    --bg:        #05051C;
    --bg-card:   #0D0D2A;
    --bg-card-2: #12122F;
    --border:    rgba(255,255,255,0.14);
    --gold:      #FFBA00;
    --gold-dim:  #C89000;
    --white:     #FFFFFF;
    --muted:     #9C9CB4;
    --danger:    #FF6459;
    --success:   #35D686;
    --radius:    14px;
    --radius-sm: 8px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    min-height:100vh;
  }

  /* ── Hero header ─────────────────────────────────────────────────────── */
  header.golf-hero{
    background: radial-gradient(ellipse at top, #0C0C30 0%, var(--bg) 70%);
    border-bottom: 1px solid var(--border);
    padding: 1.6rem 1rem 1.3rem;
    text-align:center;
    font-size:1.9rem; /* the 1em basis the logo-letter and wordmark text scale from */
  }
  header.golf-hero .back-link{
    display:inline-block; font-size:0.78rem; color:var(--muted); text-decoration:none;
    margin-bottom:1.1rem; letter-spacing:0.04em;
  }
  header.golf-hero .back-link:hover{ color:var(--gold); }
  .wordmark{
    display:flex; align-items:center; justify-content:center; gap:0.06em;
    line-height:1;
  }
  .wordmark img.logo-letter{
    width:1.4em; height:1.4em; display:block; margin-right:-0.02em;
  }
  .wordmark .rest{
    font-size:1em; font-weight:900; letter-spacing:0.02em; color:var(--white);
  }
  header.golf-hero p{
    color:var(--muted); font-size:0.85rem; margin:0.6rem 0 0; letter-spacing:0.03em;
  }

  main{ max-width:640px; margin:0 auto; padding:1.25rem 1rem 2.5rem; }

  #refresh-countdown{ font-size:0.72rem; color:var(--muted); text-align:right; margin-bottom:0.6rem; letter-spacing:0.03em; }

  /* ── Tabs ────────────────────────────────────────────────────────────── */
  .tab-bar{ display:flex; gap:0.45rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .tab-btn{
    padding:0.45rem 1rem; border-radius:2px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-size:0.76rem; font-weight:800;
    text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; font-family:inherit;
  }
  .tab-btn.active{ color:#05051C; border-color:#FFE600; background:#FFE600; box-shadow:0 0 0 2px rgba(255,230,0,0.35), 0 2px 8px rgba(255,230,0,0.5); font-weight:900; }
  .tab-btn:hover:not(.active){ border-color:var(--gold-dim); color:var(--white); }

  h2{ font-size:1rem; font-weight:900; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold); margin:0 0 0.6rem; }

  .rules-note{
    font-size:0.82rem; color:var(--muted); background:rgba(255,186,0,0.06);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:0.7rem 0.9rem; margin-bottom:1rem; line-height:1.5;
  }
  .rules-note b{ color:var(--white); }

  .card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
    padding:1.1rem; margin-bottom:1rem;
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=text], input[type=number]{
    background:#FBF7EA; border:1px solid var(--border); border-radius:var(--radius-sm);
    color:#1A1A22; padding:0.55rem 0.6rem; font-family:inherit; font-size:0.95rem;
  }
  input:focus{ outline:none; border-color:var(--gold); }

  /* ── Buttons / alerts (local, since we dropped the shared site stylesheet) ── */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:0.4rem;
    padding:0.7rem 1.4rem; border-radius:var(--radius-sm); border:none;
    font-size:0.85rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
    cursor:pointer; font-family:inherit;
  }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-primary{ background:var(--gold); color:#05051C; }
  .btn-danger{ background:var(--danger); color:#2a0a06; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--white); }
  .btn-sm{ padding:0.4rem 0.9rem; font-size:0.72rem; }
  .alert{ padding:0.75rem 1rem; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:1rem; }
  .alert-success{ background:rgba(53,214,134,0.12); border:1px solid rgba(53,214,134,0.35); color:var(--success); }
  .alert-error{ background:rgba(255,100,89,0.12); border:1px solid rgba(255,100,89,0.35); color:var(--danger); }

  /* ── Player picker ───────────────────────────────────────────────────── */
  .player-picker{ display:flex; gap:0.5rem; overflow-x:auto; padding-bottom:0.3rem; margin-bottom:1rem; -webkit-overflow-scrolling:touch; }
  .player-chip{
    flex-shrink:0; padding:0.5rem 0.9rem; border-radius:2px;
    border:1px solid var(--border); background:var(--bg-card); color:var(--white);
    font-weight:800; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.03em;
    cursor:pointer; font-family:inherit;
  }
  .player-chip.selected{ background:var(--gold); border-color:var(--gold); color:#05051C; }

  /* ── Scorecard (light paper look, scoped just to this area) ────────────── */
  .scorecard-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); }
  .scorecard{
    border:1px solid #C9BD98; border-radius:var(--radius); overflow:hidden;
    background:#F6F1DE; color:#26231A;
  }
  .sc-row{
    display:grid; grid-template-columns: 46px 42px 30px 26px 26px 26px 36px 32px 32px 32px 32px;
    align-items:center; gap:0.3rem;
    padding:0.5rem 0.5rem;
    border-bottom:1px solid #DED2A8;
  }
  .sc-row:last-child{ border-bottom:none; }
  .sc-headerrow{
    background:#EADFB8; color:#5B5230; font-size:0.66rem; font-weight:800;
    text-transform:uppercase; letter-spacing:0.03em; text-align:center;
  }
  .sc-headerrow .sc-holecell{ text-align:left; }
  .sc-row.subtotal{ background:#EFE6C4; font-weight:800; }
  .sc-row.total{ background:var(--gold); color:#05051C; font-weight:900; }
  .sc-row.total .sc-muted{ color:rgba(5,5,28,0.65); }
  .sc-holecell{ line-height:1.15; }
  .sc-hole{ font-weight:900; font-size:1.05rem; color:#1A1710; }
  .sc-row.total .sc-hole{ color:#05051C; }
  .sc-muted{ font-size:0.62rem; color:#7A7150; }
  .sc-shots, .sc-puttcell, .sc-lbcell, .sc-bicell, .sc-bacell, .sc-bocell{ text-align:center; }
  .sc-shots select, .sc-puttcell select, .sc-lbcell select, .sc-bicell select, .sc-bacell select, .sc-bocell select{
    width:100%; max-width:50px; text-align:center; text-align-last:center; font-size:1.1rem; font-weight:800;
    padding:0.5rem 0.15rem; background:#FFFDF6; border:1px solid #C9BD98; color:#1A1710;
    border-radius:6px; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0 L5 6 L10 0 Z' fill='%23A8987A'/></svg>");
    background-repeat:no-repeat; background-position:right 4px center; background-size:9px 6px;
  }
  .sc-tick{ display:flex; justify-content:center; align-items:center; }
  .sc-tick input[type=checkbox]{
    width:22px; height:22px; accent-color:var(--gold-dim); cursor:pointer; margin:0;
  }
  .sc-pts{ text-align:center; font-weight:900; font-size:1.05rem; color:var(--gold-dim); }
  .sc-row.total .sc-pts{ color:#05051C; }
  .sc-row.subtotal .sc-pts{ color:var(--gold); }

  /* ── Standings ───────────────────────────────────────────────────────── */
  table.standings{ width:100%; border-collapse:collapse; font-size:0.9rem; }
  table.standings th{
    text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); padding:0.4rem 0.5rem; border-bottom:2px solid var(--gold);
  }
  table.standings td{ padding:0.6rem 0.5rem; border-bottom:1px solid var(--border); }
  table.standings tr.qualify td{ background:rgba(255,186,0,0.07); }
  .rank-pill{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; background:var(--gold);
    color:#05051C; font-weight:900; font-size:0.72rem;
  }
  .pts-mono{ font-family:ui-monospace,monospace; font-weight:800; color:var(--gold); }

  /* ── Knockout summary ────────────────────────────────────────────────── */
  .ko-hole-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:0.5rem 0; border-bottom:1px solid rgba(255,255,255,0.07); font-size:0.86rem;
  }
  .ko-hole-row:last-child{ border-bottom:none; }
  .ko-hole-row .hole-tag{ font-weight:800; color:var(--muted); width:70px; flex-shrink:0; }
  .ko-hole-row .stable{ flex:1; text-align:center; }
  .ko-hole-row .pts{ font-weight:900; color:var(--gold); width:90px; text-align:right; }

  .winner-banner{
    margin-top:0.5rem; background:rgba(255,186,0,0.08); border:1px solid var(--gold);
    border-radius:var(--radius); padding:1rem; text-align:center;
  }
  .winner-banner .label{
    display:block; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:0.3rem;
  }
  .winner-banner .name{ font-size:1.2rem; font-weight:900; color:var(--gold); text-transform:uppercase; }
  .champion-banner{ background:linear-gradient(135deg, rgba(255,186,0,0.18), rgba(255,186,0,0.03)); border:2px solid var(--gold); }
  .champion-banner .trophy{ font-size:2rem; display:block; margin-bottom:0.4rem; }
  .tie-note{ color:var(--danger); font-size:0.78rem; text-align:center; margin-top:0.5rem; }
  .tbd{ text-align:center; padding:2rem 1rem; color:var(--muted); font-size:0.85rem; }

  /* ── Setup / Course ──────────────────────────────────────────────────── */
  .player-row{ display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem; }
  .player-badge{
    width:28px; height:28px; border-radius:50%; background:var(--gold); color:#05051C;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.8rem;
    flex-shrink:0;
  }
  .hcap-group{ display:flex; align-items:center; gap:0.35rem; flex-shrink:0; }
  .hcap-group input{ width:52px; text-align:center; }
  .hcap-label{ font-size:0.68rem; color:var(--muted); white-space:nowrap; text-transform:uppercase; }

  .format-row{ display:flex; flex-direction:column; gap:0.7rem; }
  .format-check{ display:flex; align-items:center; gap:0.6rem; font-size:0.85rem; cursor:pointer; }
  .format-check input[type=checkbox]{ width:18px; height:18px; accent-color:var(--gold); flex-shrink:0; }
  .format-check span b{ color:var(--white); }

  .stake-table th, .stake-table td{ white-space:nowrap; }
  .stake-pos{ color:var(--success); font-weight:700; }
  .stake-neg{ color:var(--danger); font-weight:700; }

  .settle-list{ display:flex; flex-direction:column; gap:0.5rem; }
  .settle-row{
    display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;
    background:var(--bg-card-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:0.6rem 0.8rem; font-size:0.88rem;
  }
  .settle-from{ font-weight:800; color:var(--danger); }
  .settle-arrow{ color:var(--muted); font-size:0.78rem; }
  .settle-to{ font-weight:800; color:var(--success); }
  .settle-amount{ margin-left:auto; font-weight:900; color:var(--gold); font-family:ui-monospace,monospace; }

  .crumble-chart-wrap{ width:100%; overflow-x:auto; }
  .crumble-svg{ width:100%; height:auto; min-width:520px; display:block; }
  .crumble-legend{ display:flex; flex-wrap:wrap; gap:0.6rem 1rem; margin-top:0.9rem; }
  .crumble-legend-item{ display:flex; align-items:center; gap:0.35rem; font-size:0.8rem; color:var(--white); }
  .crumble-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }

  /* ── Trophy Cabinet ──────────────────────────────────────────────────── */
  .trophy-board{
    margin-bottom:1.6rem; padding:3px;
    background:linear-gradient(160deg, #D9AF5C, #7A5A1E 40%, #C9973B 70%, #6B4E1A);
    border-radius:10px 10px 18px 18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  .trophy-board-crest{
    font-family:Georgia,'Times New Roman',serif;
    clip-path: polygon(
      0% 10%, 4% 4%, 10% 0%, 16% 4%, 23% 8%, 31% 3%, 39% 7%, 46% 2%, 50% 0%,
      54% 2%, 61% 7%, 69% 3%, 77% 8%, 84% 4%, 90% 0%, 96% 4%, 100% 10%,
      100% 100%, 0% 100%
    );
    background:
      repeating-linear-gradient(100deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 2px, transparent 2px, transparent 24px),
      linear-gradient(160deg, #5A3A1E, #2E1D0E 75%);
    border-radius:0 0 16px 16px;
    padding:2.4rem 1.1rem 1.2rem;
  }
  .trophy-title{
    font-size:1.2rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em;
    color:#F0C86A; text-align:center; margin-bottom:1rem;
    text-shadow:0 1px 0 rgba(0,0,0,0.5);
  }
  .trophy-title-row{
    display:flex; align-items:center; justify-content:center; gap:0.9rem;
    margin-bottom:1rem;
  }
  .trophy-team-badge{ flex-shrink:0; display:flex; }
  .trophy-subtitle{
    display:block; font-size:0.68rem; font-weight:500; text-transform:none;
    letter-spacing:0.02em; color:rgba(240,200,106,0.7); margin-top:0.2rem;
  }
  .trophy-list{
    column-count:2; column-gap:1.4rem;
    margin-bottom:1rem;
  }
  .trophy-row{
    display:flex; align-items:baseline; gap:0.5rem; padding:0.18rem 0;
    break-inside:avoid;
  }
  .trophy-year{ font-weight:700; color:#F0C86A; width:34px; flex-shrink:0; font-size:0.78rem; }
  .trophy-winner{ flex:1; color:#F3E7C8; font-size:0.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trophy-delete{
    background:none; border:none; color:rgba(240,200,106,0.45); font-size:1rem;
    cursor:pointer; padding:0 0.2rem; line-height:1; flex-shrink:0;
    font-family:-apple-system,sans-serif;
  }
  .trophy-delete:hover{ color:#FF6459; }
  .trophy-empty{ color:rgba(240,200,106,0.6); font-size:0.85rem; text-align:center; padding:0.6rem 0; font-style:italic; column-span:all; }
  .trophy-add{ display:flex; gap:0.4rem; flex-wrap:wrap; font-family:-apple-system,sans-serif; padding-top:0.9rem; border-top:1px solid rgba(240,200,106,0.18); }
  .trophy-year-input{ width:70px; flex-shrink:0; }
  .trophy-winner-input{ flex:1; min-width:110px; }
  .trophy-add-btn{ width:auto; white-space:nowrap; flex-shrink:0; }
  .trophy-chips{ display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.6rem; }
  .trophy-chip{
    background:rgba(243,217,138,0.14); border:1px solid rgba(243,217,138,0.35); color:#F3D98A;
    border-radius:14px; padding:0.3rem 0.7rem; font-size:0.76rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .trophy-chip:hover{ background:rgba(243,217,138,0.24); }

  .trophy-subnav{ display:flex; gap:0.5rem; margin-bottom:1.1rem; }
  .trophy-subnav-btn{
    flex:1; padding:0.55rem 0.8rem; border-radius:8px; border:1px solid var(--border);
    background:var(--bg-card); color:var(--muted); font-size:0.8rem; font-weight:800;
    text-transform:uppercase; letter-spacing:0.03em; cursor:pointer; font-family:inherit;
  }
  .trophy-subnav-btn.active{ color:#05051C; border-color:var(--gold); background:var(--gold); }

  .panini-page{
    background:linear-gradient(180deg, #F4F1E8, #E8E2D0);
    border:1px solid #C9BD98; border-radius:12px;
    padding:1.2rem 0.9rem 1.4rem;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .panini-header{
    font-family:Georgia,'Times New Roman',serif; font-weight:900; font-style:italic;
    font-size:1.6rem; text-align:center; color:#1A1A2E;
    text-transform:uppercase; letter-spacing:0.04em;
    margin-bottom:1.1rem;
    text-shadow:1px 1px 0 rgba(255,255,255,0.5);
  }
  .panini-player-block{ margin-bottom:1.3rem; }
  .panini-player-block:last-child{ margin-bottom:0; }
  .panini-player-name{
    font-family:Georgia,'Times New Roman',serif; font-weight:700;
    font-size:0.95rem; color:#1A1A2E; text-transform:uppercase; letter-spacing:0.05em;
    margin-bottom:0.5rem; padding-bottom:0.25rem;
    border-bottom:1px solid #C9BD98;
  }
  .panini-line{
    display:flex; gap:0.55rem; overflow-x:auto; padding-bottom:0.3rem;
    -webkit-overflow-scrolling:touch;
  }
  .panini-item{ display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:58px; }
  .panini-slot{
    position:relative; width:58px; aspect-ratio:3/4;
    border-radius:6px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
  }
  .panini-slot-empty{
    background:repeating-linear-gradient(135deg, #D3D3D3, #D3D3D3 7px, #C7C7C7 7px, #C7C7C7 14px);
    border:1.5px dashed #A8A8A8;
  }
  .panini-slot-filled{
    border:1px solid rgba(0,0,0,0.15);
    background:#fff;
    cursor:zoom-in;
    transition:transform 0.15s ease;
  }
  .panini-slot-filled:active{ transform:scale(0.94); }
  .panini-sticker-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .panini-watermark{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:58%; height:auto; opacity:0.18; pointer-events:none;
  }
  .panini-empty-name{
    position:relative; z-index:1;
    font-weight:800; font-size:0.5rem; color:#5A5A5A;
    text-align:center; text-transform:uppercase; letter-spacing:0.01em;
    padding:0 0.2rem; line-height:1.15;
  }
  .panini-stars{
    margin-top:0.25rem; font-size:0.6rem; letter-spacing:0.03em;
    color:#96650F; text-align:center; min-height:1.1em;
  }
  .save-tick{ font-size:0.7rem; color:var(--success); margin-left:0.4rem; opacity:0; transition:opacity 0.3s; }
  .save-tick.show{ opacity:1; }

  .course-section{
    font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--gold); margin:1rem 0 0.5rem; padding-top:0.75rem;
    border-top:1px solid var(--border);
  }
  .course-section:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .course-row{
    display:flex; align-items:center; gap:0.75rem; padding:0.5rem 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .course-hole{ flex:1; font-weight:800; font-size:0.9rem; }
  .course-field{ display:flex; align-items:center; gap:0.4rem; }
  .course-field label{ font-size:0.7rem; color:var(--muted); white-space:nowrap; }
  .course-field input{ width:48px; text-align:center; padding:0.4rem 0.2rem; }

  .preset-row{
    display:flex; align-items:center; gap:0.6rem; padding:0.55rem 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .preset-row:last-child{ border-bottom:none; }
  .preset-name{ flex:1; font-weight:700; font-size:0.9rem; }
  .preset-delete{ color:var(--danger); background:transparent; border:1px solid var(--border); }

  /* ── Side Bets ───────────────────────────────────────────────────────── */
  .hole-balls{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem; }
  .hole-ball{
    width:38px; height:38px; border-radius:50%; background:var(--gold); color:#05051C;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.95rem;
    flex-shrink:0;
  }
  .spin-display{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.3rem; }
  .spin-display .hole-ball{ background:var(--bg-card-2); color:var(--muted); border:1px solid var(--border); }

  /* ── Sticker lightbox (tap a sticker to see it full-size) ───────────────── */
  .sticker-lightbox{
    display:none; position:fixed; inset:0; z-index:500;
    background:rgba(0,0,0,0.86);
    align-items:center; justify-content:center;
    padding:2rem; cursor:zoom-out;
  }
  .sticker-lightbox.show{ display:flex; }
  .sticker-lightbox img{
    max-width:88vw; max-height:82vh; border-radius:12px;
    box-shadow:0 24px 60px rgba(0,0,0,0.65);
  }

  /* ── +- Ladder ───────────────────────────────────────────────────────── */
  .ladder{
    max-height:520px; overflow-y:auto;
    border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg-card-2);
  }
  .ladder-rung{
    display:flex; align-items:center; gap:0.7rem;
    padding:0.5rem 0.8rem;
    border-bottom:1px solid rgba(255,255,255,0.06);
    min-height:2.4rem;
  }
  .ladder-rung:last-child{ border-bottom:none; }
  .ladder-rung.ladder-zero{ background:rgba(255,186,0,0.10); border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); }
  .ladder-value{
    width:34px; flex-shrink:0; text-align:right; font-weight:900; font-family:ui-monospace,monospace;
    font-size:0.85rem; color:var(--muted);
  }
  .ladder-zero .ladder-value{ color:var(--gold); }
  .ladder-track{ display:flex; gap:0.4rem; flex-wrap:wrap; flex:1; }
  .ladder-player{
    display:inline-flex; align-items:center; gap:0.3rem;
    padding:0.25rem 0.6rem; border-radius:14px;
    font-size:0.78rem; font-weight:800; color:#05051C;
    white-space:nowrap;
  }
</style>
</head>
<body>
  <header class="golf-hero">
    <a href="/" class="back-link">&larr; BACK TO ISWEEP</a>
    <div class="wordmark">
      <img src="/assets/golf-logo.png" alt="B" class="logo-letter">
      <span class="rest">EAVER</span>
    </div>
    <p>Stableford scoring &middot; live leaderboard</p>
  </header>

  <main>
    <div id="refresh-countdown">LIVE &middot; syncs every few seconds</div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="scorecard">My Scorecard</button>
      <button class="tab-btn" data-tab="setup">Format</button>
      <button class="tab-btn" data-tab="course">Course</button>
      <button class="tab-btn" data-tab="football">Football</button>
      <button class="tab-btn" data-tab="sidebets">666 and PP</button>
      <button class="tab-btn" data-tab="stats">Stats</button>
      <button class="tab-btn" data-tab="trophies">Trophy Cabinet</button>
      <button class="tab-btn" data-tab="playerpages">Players</button>
      <button class="tab-btn" data-tab="ryder">Ryder Cup 4 Ball SF</button>
      <button class="tab-btn" data-tab="plusminus">+-</button>
    </div>
    <div id="golf-content"><p style="color:var(--muted)">Loading&hellip;</p></div>
  </main>

  <script src="golf.js"></script>
</body>
</html>
