<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beaver">
<link rel="apple-touch-icon" href="/assets/golf-logo.png">
<title>BEAVER</title>
<style>
  :root{
    --bg:        #05051C;
    --bg-card:   #0D0D2A;
    --bg-card-2: #12122F;
    --border:    rgba(255,255,255,0.14);
    --gold:      #FFBA00;
    --gold-dim:  #C89000;
    --white:     #FFFFFF;
    --muted:     #9C9CB4;
    --danger:    #FF6459;
    --success:   #35D686;
    --radius:    14px;
    --radius-sm: 8px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    min-height:100vh;
  }

  /* ── Hero header ─────────────────────────────────────────────────────── */
  header.golf-hero{
    background: radial-gradient(ellipse at top, #0C0C30 0%, var(--bg) 70%);
    border-bottom: 1px solid var(--border);
    padding: 1.6rem 1rem 1.3rem;
    text-align:center;
    font-size:1.9rem; /* the 1em basis the logo-letter and wordmark text scale from */
  }
  header.golf-hero .back-link{
    display:inline-block; font-size:0.78rem; color:var(--muted); text-decoration:none;
    margin-bottom:1.1rem; letter-spacing:0.04em;
  }
  header.golf-hero .back-link:hover{ color:var(--gold); }
  .wordmark{
    display:flex; align-items:center; justify-content:center; gap:0.06em;
    line-height:1;
  }
  .wordmark img.logo-letter{
    width:1.4em; height:1.4em; display:block; margin-right:-0.02em;
  }
  .wordmark .rest{
    font-size:1em; font-weight:900; letter-spacing:0.02em; color:var(--white);
  }
  header.golf-hero p{
    color:var(--muted); font-size:0.85rem; margin:0.6rem 0 0; letter-spacing:0.03em;
  }

  main{ max-width:640px; margin:0 auto; padding:1.25rem 1rem 2.5rem; }

  #refresh-countdown{ font-size:0.72rem; color:var(--muted); text-align:right; margin-bottom:0.6rem; letter-spacing:0.03em; }

  /* ── Tabs ────────────────────────────────────────────────────────────── */
  .tab-bar{ display:flex; gap:0.45rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .tab-btn{
    padding:0.45rem 1rem; border-radius:2px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-size:0.76rem; font-weight:800;
    text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; font-family:inherit;
  }
  .tab-btn.active{ color:#05051C; border-color:var(--gold); background:var(--gold); }
  .tab-btn:hover:not(.active){ border-color:var(--gold-dim); color:var(--white); }

  h2{ font-size:1rem; font-weight:900; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold); margin:0 0 0.6rem; }

  .rules-note{
    font-size:0.82rem; color:var(--muted); background:rgba(255,186,0,0.06);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:0.7rem 0.9rem; margin-bottom:1rem; line-height:1.5;
  }
  .rules-note b{ color:var(--white); }

  .card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
    padding:1.1rem; margin-bottom:1rem;
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=text], input[type=number]{
    background:#FBF7EA; border:1px solid var(--border); border-radius:var(--radius-sm);
    color:#1A1A22; padding:0.55rem 0.6rem; font-family:inherit; font-size:0.95rem;
  }
  input:focus{ outline:none; border-color:var(--gold); }

  /* ── Buttons / alerts (local, since we dropped the shared site stylesheet) ── */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:0.4rem;
    padding:0.7rem 1.4rem; border-radius:var(--radius-sm); border:none;
    font-size:0.85rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
    cursor:pointer; font-family:inherit;
  }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-primary{ background:var(--gold); color:#05051C; }
  .btn-danger{ background:var(--danger); color:#2a0a06; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--white); }
  .btn-sm{ padding:0.4rem 0.9rem; font-size:0.72rem; }
  .alert{ padding:0.75rem 1rem; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:1rem; }
  .alert-success{ background:rgba(53,214,134,0.12); border:1px solid rgba(53,214,134,0.35); color:var(--success); }
  .alert-error{ background:rgba(255,100,89,0.12); border:1px solid rgba(255,100,89,0.35); color:var(--danger); }

  /* ── Player picker ───────────────────────────────────────────────────── */
  .player-picker{ display:flex; gap:0.5rem; overflow-x:auto; padding-bottom:0.3rem; margin-bottom:1rem; -webkit-overflow-scrolling:touch; }
  .player-chip{
    flex-shrink:0; padding:0.5rem 0.9rem; border-radius:2px;
    border:1px solid var(--border); background:var(--bg-card); color:var(--white);
    font-weight:800; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.03em;
    cursor:pointer; font-family:inherit;
  }
  .player-chip.selected{ background:var(--gold); border-color:var(--gold); color:#05051C; }

  /* ── Scorecard ───────────────────────────────────────────────────────── */
  .scorecard{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--bg-card); }
  .sc-row{
    padding:0.55rem 0.7rem;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .sc-row:last-child{ border-bottom:none; }
  .sc-line1{
    display:grid; grid-template-columns: 62px 1fr 52px;
    align-items:center; gap:0.5rem;
  }
  .sc-line2{
    display:flex; align-items:center; gap:0.6rem; margin-top:0.5rem;
  }
  .sc-putt{ display:flex; align-items:center; gap:0.4rem; }
  .sc-putt label{ font-size:0.66rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; white-space:nowrap; }
  .sc-putt input{ width:46px; text-align:center; padding:0.35rem; }
  .sc-row.total .sc-putt label{ color:rgba(5,5,28,0.65); }
  .sc-row.subtotal{ background:rgba(255,186,0,0.06); font-weight:800; }
  .sc-row.total{ background:var(--gold); color:#05051C; font-weight:900; }
  .sc-row.total .sc-muted{ color:rgba(5,5,28,0.65); }
  .sc-hole{ font-weight:900; font-size:1.05rem; line-height:1.1; }
  .sc-muted{ font-size:0.66rem; color:var(--muted); }
  .sc-shots input{
    width:100%; text-align:center; font-size:1.05rem; font-weight:800;
    padding:0.4rem;
  }
  .sc-bonus{ display:flex; gap:0.3rem; }
  .sc-bonus button{
    flex:1; border:1px solid var(--border); background:var(--bg-card-2); color:var(--muted);
    border-radius:4px; font-size:0.68rem; font-weight:800; padding:0.4rem 0; cursor:pointer; font-family:inherit;
  }
  .sc-bonus button.on{ background:var(--success); border-color:var(--success); color:#05200f; }
  .sc-pts{ text-align:right; font-weight:900; font-size:1.05rem; color:var(--gold); }
  .sc-row.total .sc-pts{ color:#05051C; }
  .sc-row.subtotal .sc-pts{ color:var(--gold); }

  /* ── Standings ───────────────────────────────────────────────────────── */
  table.standings{ width:100%; border-collapse:collapse; font-size:0.9rem; }
  table.standings th{
    text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); padding:0.4rem 0.5rem; border-bottom:2px solid var(--gold);
  }
  table.standings td{ padding:0.6rem 0.5rem; border-bottom:1px solid var(--border); }
  table.standings tr.qualify td{ background:rgba(255,186,0,0.07); }
  .rank-pill{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; background:var(--gold);
    color:#05051C; font-weight:900; font-size:0.72rem;
  }
  .pts-mono{ font-family:ui-monospace,monospace; font-weight:800; color:var(--gold); }

  /* ── Knockout summary ────────────────────────────────────────────────── */
  .ko-hole-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:0.5rem 0; border-bottom:1px solid rgba(255,255,255,0.07); font-size:0.86rem;
  }
  .ko-hole-row:last-child{ border-bottom:none; }
  .ko-hole-row .hole-tag{ font-weight:800; color:var(--muted); width:70px; flex-shrink:0; }
  .ko-hole-row .stable{ flex:1; text-align:center; }
  .ko-hole-row .pts{ font-weight:900; color:var(--gold); width:90px; text-align:right; }

  .winner-banner{
    margin-top:0.5rem; background:rgba(255,186,0,0.08); border:1px solid var(--gold);
    border-radius:var(--radius); padding:1rem; text-align:center;
  }
  .winner-banner .label{
    display:block; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:0.3rem;
  }
  .winner-banner .name{ font-size:1.2rem; font-weight:900; color:var(--gold); text-transform:uppercase; }
  .champion-banner{ background:linear-gradient(135deg, rgba(255,186,0,0.18), rgba(255,186,0,0.03)); border:2px solid var(--gold); }
  .champion-banner .trophy{ font-size:2rem; display:block; margin-bottom:0.4rem; }
  .tie-note{ color:var(--danger); font-size:0.78rem; text-align:center; margin-top:0.5rem; }
  .tbd{ text-align:center; padding:2rem 1rem; color:var(--muted); font-size:0.85rem; }

  /* ── Setup / Course ──────────────────────────────────────────────────── */
  .player-row{ display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem; }
  .player-badge{
    width:28px; height:28px; border-radius:50%; background:var(--gold); color:#05051C;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.8rem;
    flex-shrink:0;
  }
  .hcap-group{ display:flex; align-items:center; gap:0.35rem; flex-shrink:0; }
  .hcap-group input{ width:52px; text-align:center; }
  .hcap-label{ font-size:0.68rem; color:var(--muted); white-space:nowrap; text-transform:uppercase; }
  .save-tick{ font-size:0.7rem; color:var(--success); margin-left:0.4rem; opacity:0; transition:opacity 0.3s; }
  .save-tick.show{ opacity:1; }

  .course-section{
    font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--gold); margin:1rem 0 0.5rem; padding-top:0.75rem;
    border-top:1px solid var(--border);
  }
  .course-section:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .course-row{
    display:flex; align-items:center; gap:0.75rem; padding:0.5rem 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .course-hole{ flex:1; font-weight:800; font-size:0.9rem; }
  .course-field{ display:flex; align-items:center; gap:0.4rem; }
  .course-field label{ font-size:0.7rem; color:var(--muted); white-space:nowrap; }
  .course-field input{ width:48px; text-align:center; padding:0.4rem 0.2rem; }

  .preset-row{
    display:flex; align-items:center; gap:0.6rem; padding:0.55rem 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .preset-row:last-child{ border-bottom:none; }
  .preset-name{ flex:1; font-weight:700; font-size:0.9rem; }
  .preset-delete{ color:var(--danger); background:transparent; border:1px solid var(--border); }

  /* ── Side Bets ───────────────────────────────────────────────────────── */
  .hole-balls{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem; }
  .hole-ball{
    width:38px; height:38px; border-radius:50%; background:var(--gold); color:#05051C;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.95rem;
    flex-shrink:0;
  }
  .spin-display{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.3rem; }
  .spin-display .hole-ball{ background:var(--bg-card-2); color:var(--muted); border:1px solid var(--border); }
</style>
</head>
<body>
  <header class="golf-hero">
    <a href="/" class="back-link">&larr; BACK TO ISWEEP</a>
    <div class="wordmark">
      <img src="/assets/golf-logo.png" alt="B" class="logo-letter">
      <span class="rest">EAVER</span>
    </div>
    <p>Stableford scoring &middot; live leaderboard</p>
  </header>

  <main>
    <div id="refresh-countdown">LIVE &middot; syncs every few seconds</div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="scorecard">My Scorecard</button>
      <button class="tab-btn" data-tab="setup">Players</button>
      <button class="tab-btn" data-tab="course">Course</button>
      <button class="tab-btn" data-tab="standings">Table</button>
      <button class="tab-btn" data-tab="semis">Semis</button>
      <button class="tab-btn" data-tab="final">Final</button>
      <button class="tab-btn" data-tab="sidebets">Side Bets</button>
    </div>
    <div id="golf-content"><p style="color:var(--muted)">Loading&hellip;</p></div>
  </main>

  <script src="golf.js"></script>
</body>
</html>
